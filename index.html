<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      let savedTheme;
      try { savedTheme = localStorage.getItem('theme'); } catch {}
      if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#FFFFFF" />
    <script>
      document.querySelector('meta[name="theme-color"]').content = document.documentElement.classList.contains('dark') ? '#0B191A' : '#FFFFFF';
    </script>

    <title>Grow In Tech (GiT) — Digital skills for University of Ibadan students</title>
    <meta
      name="description"
      content="GiT equips University of Ibadan students with practical, in-demand digital skills through hands-on training, mentorship, and community — regardless of department or prior technical background."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Grow In Tech (GiT)" />
    <meta property="og:title" content="Grow In Tech (GiT)" />
    <meta
      property="og:description"
      content="A generation of UI students building the future. Practical digital skills through hands-on training, mentorship, and community."
    />
    <meta property="og:image" content="/images/hero.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
